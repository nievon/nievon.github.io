<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Никита (nievon) — fullstack-разработчик, backend</title>
    <meta
      name="description"
      content="Никита (nievon) — fullstack-разработчик с фокусом на backend: серверная логика, API, CRM-связки и платёжные интеграции на аутсорсинге."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="nievon" />
    <script>
      // Set theme and language before first paint to avoid a flash.
      (function () {
        document.documentElement.classList.add('js');
        try {
          var t = localStorage.getItem('theme-v2');
          if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
          var l = localStorage.getItem('lang');
          if (l !== 'ru' && l !== 'en') l = (navigator.language || 'ru').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en';
          document.documentElement.lang = l;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
